# chatgpt.com/backend-api/codex への中継。Kong AI Gateway 2.3.0 がこの上流をそのままでは集計できないので、2 点だけ補う。
#
# 1. SSE の応答に Content-Type が無い。Kong はそれが無いと openai 形式ではストリームを切り
#    （normalize-sse-chunk.lua の ipairs(nil)）、passthrough では usage を読み飛ばす
# 2. Codex は response.completed を受け取るとすぐ接続を切る。上流がまだ応答を閉じていないと、Kong は終端を見ないまま
#    リクエストが中断され、コストのイベントを出さない。完了イベントの直後にこちらから応答を閉じる
#
# ChatGPT のトークンが通るので、ログは出さずポートも公開しない
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  resolver 127.0.0.11 ipv6=off valid=30s;
  server {
    listen 8080;
    client_max_body_size 32m;
    location / {
      set $upstream https://chatgpt.com;
      proxy_pass $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_name chatgpt.com;
      proxy_set_header Host chatgpt.com;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 600s;

      header_filter_by_lua_block {
        if not ngx.header["Content-Type"] then
          ngx.header["Content-Type"] = "text/event-stream"
        end
      }

      body_filter_by_lua_block {
        local chunk = ngx.arg[1]
        if not chunk or chunk == "" then return end
        local ctx = ngx.ctx
        local from = 1
        if not ctx.terminal_seen then
          local s = chunk:find('"type":"response.completed"', 1, true)
                 or chunk:find('"type":"response.failed"', 1, true)
                 or chunk:find('"type":"response.incomplete"', 1, true)
          if not s then return end
          ctx.terminal_seen = true
          from = s
        end
        -- 完了イベントの JSON は複数チャンクにまたがる。イベントの終わり（空行）まで流してから閉じる
        local e = chunk:find("\n\n", from, true)
        if e then
          ngx.arg[1] = chunk:sub(1, e + 1)
          ngx.arg[2] = true
        end
      }
    }
  }
}
